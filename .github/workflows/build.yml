name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q LyricFlow.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: |
          cd LyricFlow
          printf "android.useAndroidX=true\nandroid.suppressUnsupportedCompileSdk=35\n" > gradle.properties
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LyricFlow-apk
          path: LyricFlow/app/build/outputs/apk/debug/app-debug.apk
